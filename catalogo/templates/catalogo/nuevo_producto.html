<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear producto</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        form { max-width: 32rem; }
        button { background: #1769aa; color: white; border: 0; cursor: pointer; padding: 0.6rem 1rem; }
    </style>
</head>
<body>
    <h1>Crear producto</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
    <p><a href="{% url 'lista_productos' %}">Volver al listado</a></p>
</body>
</html>
