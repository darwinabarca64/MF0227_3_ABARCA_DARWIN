<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.6rem; text-align: left; }
        th { background: #f2f2f2; }
        .button { background: #1769aa; color: white; display: inline-block; padding: 0.6rem 1rem; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Productos</h1>
    <a class="button" href="{% url 'nuevo_producto' %}">Crear Producto</a>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio original (€)</th>
                <th>Descuento (%)</th>
                <th>Precio final (€)</th>
            </tr>
        </thead>
        <tbody>
            {% for item in productos %}
                <tr>
                    <td>{{ item.producto.nombre }}</td>
                    <td>{{ item.producto.precio }}</td>
                    <td>{{ item.producto.descuento }}</td>
                    <td>{{ item.precio_final|floatformat:2 }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">Todavía no hay productos registrados.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
